<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Add New Set</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Log a new addition to your archival inventory.</p>
</header>
<form class="space-y-stack-lg" id="add-set-form">
<!-- Hero Image Upload Area -->
<div class="relative group">
<label class="cursor-pointer block" for="image-upload">
<div class="w-full aspect-video rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center overflow-hidden transition-all group-hover:bg-surface-container-highest">

<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2">add_a_photo</span>
<p class="font-title-md text-title-md text-on-surface">Upload Set Image</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Optional (High-resolution recommended)</p>
</div>
<img class="hidden absolute inset-0 w-full h-full object-cover" data-alt="A clean, minimalist studio shot of a complex Lego architectural model on a white pedestal. The lighting is bright and even, casting soft shadows, following a professional product photography style with a vibrant red accent in the background. High-key aesthetic with sharp focus on the precision-engineered plastic bricks." id="image-preview"/>
</div>
</label>
<input accept="image/*" class="hidden" id="image-upload" type="file"/>
</div>
<!-- Mandatory Fields Group -->
<section class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-sm">
<h3 class="font-label-sm text-label-sm text-primary mb-stack-sm uppercase tracking-wider">Required Information</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Set Name/Number -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm px-1">Set Name or Number *</label>
<input class="w-full h-12 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md px-4 outline-none transition-all" placeholder="e.g. 10305 Lion Knights' Castle" required="" type="text"/>
</div>
<!-- Status Dropdown -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm px-1">Inventory Status *</label>
<select class="w-full h-12 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md px-4 outline-none transition-all appearance-none" required="">
<option disabled="" selected="" value="">Select Status</option>
<option value="sealed">Sealed (MISB)</option>
<option value="unbuilt">Unbuilt (Open Box)</option>
<option value="in-progress">In Progress</option>
<option value="built">Built / Displayed</option>
<option value="stored">Archived / Stored</option>
</select>
</div>
</div>
</section>
<!-- Metadata Bento Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Theme & Year -->
<div class="space-y-stack-md">
<div class="flex flex-col gap-1">

<input class="w-full h-12 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md px-4 outline-none" placeholder="e.g. Icons, Technic" type="text"/>
</div>
<div class="flex flex-col gap-1">

<input class="w-full h-12 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md px-4 outline-none" placeholder="2024" type="number"/>
</div>
</div>
<!-- Piece Count & Purchase Date -->

<input class="w-full h-12 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md px-4 outline-none" placeholder="4514" type="number"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm px-1">Purchase Date</label>
<input class="w-full h-12 rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md px-4 outline-none" type="date"/>
</div>

</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm px-1">Collector's Notes</label>
<textarea class="w-full rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md p-4 outline-none transition-all" placeholder="Condition details, missing parts, or purchase price..." rows="3"></textarea>

</section>

<span class="material-symbols-outlined text-sm">event</span>

<div class="flex items-center gap-2 text-on-surface-variant">

<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</div>

<script>
        // Set automatic current date
        const dateElement = document.getElementById('current-date');
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        dateElement.textContent = now.toLocaleDateString('en-US', options);

        // Handle image preview
        const imageUpload = document.getElementById('image-upload');
        const imagePreview = document.getElementById('image-preview');
        const imagePlaceholder = document.getElementById('image-placeholder');

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    imagePlaceholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Simple form validation micro-interaction
        const form = document.getElementById('add-set-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Saving...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Success! Set added to your BrickVault collection.');
                btn.innerHTML = 'Save to Collection';
                btn.disabled = false;
                form.reset();
                imagePreview.classList.add('hidden');
                imagePlaceholder.classList.remove('hidden');
            }, 1200);
        });
    </script>
